name: Build Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Setup Keystore for Signing
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-artifacts
          VERSION_NAME="$(grep -m 1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Packaging release APK for version: $VERSION_NAME"
          # Ensure exact required naming: ArAr Cicis v<versionName>.apk
          TARGET_NAME="ArAr Cicis v${VERSION_NAME}.apk"
          FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" "release-artifacts/$TARGET_NAME"
            echo "Successfully created release artifact: release-artifacts/$TARGET_NAME"
          else
            echo "Error: No APK found in app/build/outputs/apk/release"
            exit 1
          fi
          ls -lh release-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArAr-Cicis-Release-APK
          path: release-artifacts/
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
